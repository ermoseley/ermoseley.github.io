<main id="shell">
  <section class="chapter" id="top" data-nav="00" data-label="Notes" data-preset="blog" data-accent="#ccd9f0">
    <p class="chapter__tag rv"><b>Notes</b> <span><a href="../index.html#blog">← back to the site</a></span> <hr></p>

    <div class="chapter__grid solo">
      <div class="stack">
        <header>
          <h2 class="title rv">Notes from the <em>margin</em></h2>

            Longer thoughts on numerics, dust, and whatever else will not fit in a paper.
          </p>

<script src="../js/field.js"></script>
<script src="../js/blog.js"></script>
<script>
  (function () {
    var c = document.getElementById('field');
    var f = window.Field ? window.Field.create(c) : null;
    if (f) {
      f.setPreset('blog');
      var px = null, py = null;
      addEventListener('pointermove', function (e) {
        var w = innerWidth, h = innerHeight;
        if (px !== null) f.splat(e.clientX / w, 1 - e.clientY / h, (e.clientX - px) / w * 2600, -(e.clientY - py) / h * 2600, 0.0085);
        px = e.clientX; py = e.clientY;
      }, { passive: true });
      var last = scrollY;
      addEventListener('scroll', function () {
        var d = scrollY - last; last = scrollY;
        f.shear(Math.max(-280, Math.min(280, d * 3.0)));
      }, { passive: true });
    }
    document.querySelectorAll('.rv').forEach(function (n) { n.classList.add('in'); });
    document.getElementById('year').textContent = new Date().getFullYear();
    window.Blog.render(document.getElementById('post-list'), '', 0);
  })();
</script>
</body>
