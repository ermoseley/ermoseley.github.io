name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "_quarto.yml"
      - "**/*.qmd"
      - "**.bib"
      - "assets/**"
      - ".nojekyll"
      - "robots.txt"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "_quarto.yml"
      - "**/*.qmd"
      - "**.bib"
      - "assets/**"
      - ".nojekyll"
      - "robots.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
